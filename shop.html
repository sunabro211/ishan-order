<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>주문하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Sora:wght@400;500;600;700&display=swap');
  :root{
    --bg:#070915; --bg2:#0e1330; --card:rgba(255,255,255,.05);
    --ink:#f5f6ff; --muted:#9aa0c8; --line:rgba(180,190,255,.16);
    --green:#3b5bff; --green-d:#e7b45a;
    --blue:#6d8bff; --red:#ff2d6b; --amber:#f3d18b;
    --royal:#3b5bff; --ruby:#ff2d6b; --gold:#f3d18b; --gold2:#e7b45a;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;font-family:'Sora',-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  body.lang-si{font-family:"Noto Sans Sinhala","Malgun Gothic",sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60vw 42vw at 82% -6%,rgba(59,91,255,.30),transparent 60%),
      radial-gradient(56vw 46vw at -12% 22%,rgba(255,45,107,.22),transparent 60%),
      radial-gradient(52vw 52vw at 58% 112%,rgba(243,209,139,.13),transparent 60%);}

  header{position:sticky;top:0;z-index:20;padding:12px 14px;display:flex;align-items:center;gap:10px;color:#fff;
         background:linear-gradient(160deg,rgba(59,91,255,.26),rgba(255,45,107,.08)),rgba(14,19,48,.72);
         backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  header .title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;letter-spacing:.4px;
         flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
         background:linear-gradient(100deg,var(--gold),#fff 48%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hbtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);font-weight:600;
        padding:7px 12px;border-radius:999px;font-size:13px}
  .hbtn:active{transform:scale(.96)}
  .hlogo{width:34px;height:34px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#fff;
         box-shadow:0 0 0 1px rgba(243,209,139,.5),0 0 18px rgba(243,209,139,.5)}

  nav{display:flex;gap:8px;padding:10px 12px;position:sticky;top:52px;z-index:15;
      background:linear-gradient(180deg,rgba(7,9,21,.92),rgba(7,9,21,.5));backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line)}
  nav button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);
             padding:10px;border-radius:999px;font-size:14px;font-weight:600;font-family:inherit;transition:.16s}
  nav button.on{color:#0a0d1f;border-color:transparent;font-weight:700;
                background:linear-gradient(100deg,var(--gold),var(--gold2));box-shadow:0 4px 16px rgba(231,180,90,.4)}

  main{padding:14px;max-width:640px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;backdrop-filter:blur(12px)}
  .card h3{margin:0 0 11px;font-size:17px;font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.3px}
  label{display:block;font-size:13px;color:var(--muted);margin:11px 0 5px}
  input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;
               background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;transition:.16s}
  input:focus,select:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(231,180,90,.2);background:rgba(255,255,255,.06)}
  input::placeholder{color:#5f6698}

  .btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#0a0d1f;font-family:inherit;
       background:linear-gradient(100deg,var(--gold),var(--gold2));box-shadow:0 8px 22px rgba(231,180,90,.34);transition:.16s;margin-top:12px}
  .btn:active{transform:scale(.99)}
  .btn.grey{background:rgba(255,255,255,.09);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.sm{width:auto;padding:11px 20px;font-size:15px;margin:0}
  .switch{text-align:center;margin-top:14px;color:var(--blue);font-size:14px;font-weight:600;cursor:pointer}

  .prod{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;
        background:var(--card);backdrop-filter:blur(8px);transition:.18s}
  .prod:hover{border-color:var(--royal);box-shadow:0 10px 26px rgba(59,91,255,.18)}
  .prod .nm{flex:1;min-width:0}
  .prod .nm b{display:block;font-size:15px}
  .prod .nm span{font-size:13px;color:var(--gold);font-weight:600}
  .qty{display:flex;align-items:center;gap:9px}
  .qty button{width:36px;height:36px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:11px;
              font-size:19px;font-weight:700;color:var(--gold);transition:.15s;line-height:1}
  .qty button:active{transform:scale(.9);background:rgba(243,209,139,.16)}
  .qty span{min-width:22px;text-align:center;font-weight:700}

  .cartbar{position:sticky;bottom:0;padding:14px;margin:12px -14px -14px;display:flex;align-items:center;gap:12px;
           background:linear-gradient(180deg,rgba(14,19,48,.55),rgba(10,13,31,.9));backdrop-filter:blur(18px);
           border-top:1px solid rgba(243,209,139,.35);box-shadow:0 -12px 34px rgba(0,0,0,.45)}
  .cartbar .sum{flex:1}
  .cartbar .sum b{font-size:20px;font-weight:700}
  .cartbar .sum span{font-size:12px;color:var(--muted);display:block}

  .order{border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px;background:var(--card);backdrop-filter:blur(8px)}
  .order .top{display:flex;justify-content:space-between;gap:8px}
  .order b{font-size:15px}
  .badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
  .b-wait{background:rgba(243,209,139,.18);color:var(--gold)}
  .b-go{background:rgba(109,139,255,.2);color:#aab4ff}
  .b-done{background:rgba(52,211,153,.18);color:#34d399}

  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
  .hint{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.55}
  #toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:50;pointer-events:none;max-width:90%;text-align:center;
         background:rgba(14,19,48,.92);color:#fff;border:1px solid var(--line);backdrop-filter:blur(12px);
         padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #toast.show{opacity:1}
  #loading{position:fixed;inset:0;background:rgba(7,9,21,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60}
  .spin{width:40px;height:40px;border:3px solid rgba(243,209,139,.22);border-top-color:var(--gold);border-radius:50%;
        animation:sp 1s linear infinite;filter:drop-shadow(0 0 8px rgba(243,209,139,.5))}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header>
  <img src="logo.png" alt="" class="hlogo"><div class="title" id="appName">주문하기</div>
  <span class="hbtn" id="me" style="display:none"></span>
  <button class="hbtn" id="langBtn" onclick="toggleLang()">සිං</button>
  <button class="hbtn" id="logoutBtn" onclick="logout()" style="display:none">↩</button>
</header>
<nav id="nav" style="display:none"></nav>
<main id="main"></main>
<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>

<script>
/* ============================================================
   API_URL 에 index.html 과 "똑같은" Apps Script 배포 URL 을 붙여넣으세요.
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbyMi38MYZ021ow-j-O3ZIxMBvy8CALEoSAHnxLoGz3fZ5BmNOlbFczLW6BMpuDxHHd1/exec";

const I18N = {
  ko:{ login:'로그인', signup:'회원가입', id_ph:'이메일 또는 전화번호', pw:'비밀번호',
       email:'이메일', name:'이름', phone:'전화번호', addr:'주소',
       to_signup:'처음이세요? 회원가입', to_login:'이미 계정이 있어요 · 로그인',
       tab_shop:'상점', tab_orders:'내 주문', cart:'장바구니', order_now:'주문하기',
       total:'합계', empty_cart:'담은 상품이 없어요', empty_order:'주문 내역이 없어요',
       welcome:'환영합니다', your_no:'회원님의 고객번호',
       st_wait:'입금대기', st_go:'진행중', st_done:'배달완료',
       order_ok:'주문 완료! 확인 메일을 보냈어요', order_ok2:'메일의 계좌로 입금 후, 이샨에게 입금 스크린샷과 주문번호를 보내주세요.',
       signup_ok:'회원가입 완료! 고객번호', need_id:'이메일/전화번호와 비밀번호를 입력하세요',
       won:'원', mode_title:'받는 방법', m_delivery:'배달', m_pickup:'픽업', all:'전체', empty_cat:'이 분류에 상품이 없어요' },
  si:{ login:'පිවිසෙන්න', signup:'ලියාපදිංචිය', id_ph:'ඊමේල් හෝ දුරකථනය', pw:'මුරපදය',
       email:'ඊමේල්', name:'නම', phone:'දුරකථනය', addr:'ලිපිනය',
       to_signup:'මුල් වරද? ලියාපදිංචි වන්න', to_login:'දැනටමත් ගිණුමක් තිබේ · පිවිසෙන්න',
       tab_shop:'සාප්පුව', tab_orders:'මගේ ඇණවුම්', cart:'කරත්තය', order_now:'ඇණවුම් කරන්න',
       total:'එකතුව', empty_cart:'භාණ්ඩ නැත', empty_order:'ඇණවුම් නැත',
       welcome:'ආයුබෝවන්', your_no:'ඔබේ පාරිභෝගික අංකය',
       st_wait:'ගෙවීම බලාපොරොත්තුවෙන්', st_go:'ක්‍රියාත්මකයි', st_done:'බෙදා හරින ලදී',
       order_ok:'ඇණවුම සම්පූර්ණයි! ඊමේල් එකක් යවන ලදී', order_ok2:'ඊමේල් හි ගිණුමට ගෙවා, ඉෂාන්ට රිසිට්පත සහ ඇණවුම් අංකය එවන්න.',
       signup_ok:'ලියාපදිංචිය සම්පූර්ණයි! අංකය', need_id:'ඊමේල්/දුරකථනය සහ මුරපදය ඇතුළත් කරන්න',
       won:'', mode_title:'ලබාගැනීමේ ක්‍රමය', m_delivery:'බෙදාහැරීම', m_pickup:'ලබාගැනීම', all:'සියල්ල', empty_cat:'මෙම වර්ගයේ භාණ්ඩ නැත' }
};
let LANG = localStorage.getItem('shop_lang') || 'ko';
function t(k){ return (I18N[LANG]&&I18N[LANG][k]) || I18N.ko[k] || k; }

let ME = null;             // {no, name}
let ITEMS = [], CART = {}, CFG = {cur:'₩'};
let AUTHMODE = 'login', TAB = 'shop', MODE = '배달', CAT = '';
const CATS=[{ko:'향신료',si:'කුළුබඩු වර්ග',e:'🥣'},{ko:'병/캔류',si:'බෝතල් සහ ටින් වර්ග',e:'🍾'},{ko:'채소/과일',si:'එළවලු සහ පළතුරු',e:'🍎'},{ko:'건어물',si:'කරවල වර්ග',e:'🐟'},{ko:'비스킷류',si:'බිස්කට් වර්ග',e:'🍪'},{ko:'차/분유',si:'තේ කොල/කිරිපිටි',e:'☕'},{ko:'콩고기/면류',si:'සෝයා/ඉදිආප්ප/නූඩ්ල්ස්',e:'🍜'},{ko:'곡류/쌀',si:'සහල්/ධාන්‍ය වර්ග',e:'🌾'},{ko:'육류/생선',si:'මස් මාළු වර්ග',e:'🥩'},{ko:'초콜렛',si:'චොකලට් වර්ග',e:'🍫'},{ko:'마찬 음식',si:'මචං කෑම වර්ග',e:'🔔'},{ko:'로티/파라타/냉동식품',si:'රොටී/පරාටා සහ ශීතකල ආහාර',e:'❄️'},{ko:'기타',si:'වෙනත්',e:'📦'}];

function loading(on){ document.getElementById('loading').style.display=on?'flex':'none'; }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2600); }
function money(n){ return (CFG.cur||'₩')+Number(n||0).toLocaleString(); }
async function api(action, params={}){
  if(API_URL.indexOf('http')!==0){ toast('API_URL을 설정하세요'); throw new Error('no url'); }
  loading(true);
  try{
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action},params))});
    const j=await res.json(); if(!j.ok) throw new Error(j.error||'오류'); return j.data;
  }catch(e){ toast(e.message||'통신 오류'); throw e; }
  finally{ loading(false); }
}

function toggleLang(){ LANG=LANG==='ko'?'si':'ko'; localStorage.setItem('shop_lang',LANG);
  document.body.classList.toggle('lang-si',LANG==='si');
  document.getElementById('langBtn').textContent=LANG==='ko'?'සිං':'한국어'; render(); }

async function boot(){
  document.body.classList.toggle('lang-si',LANG==='si');
  document.getElementById('langBtn').textContent=LANG==='ko'?'සිං':'한국어';
  try{ CFG = await api('shopConfig'); CFG.cur=CFG.currency||'₩';
       document.getElementById('appName').textContent=CFG.appName||'주문하기'; }catch(e){}
  const saved=localStorage.getItem('shop_me');
  if(saved){ ME=JSON.parse(saved); afterLogin(); } else { render(); }
}

/* ── 로그인/회원가입 ── */
function render(){
  const m=document.getElementById('main');
  if(!ME){ document.getElementById('nav').style.display='none'; m.innerHTML=authView(); return; }
  document.getElementById('nav').style.display='flex';
  buildNav();
  if(TAB==='shop'){ m.innerHTML=shopView(); } else { m.innerHTML=''; ordersView(m); }
}
function authView(){
  if(AUTHMODE==='login'){
    return `<div class="card"><h3>${t('login')}</h3>
      <label>${t('id_ph')}</label><input id="lid" placeholder="${t('id_ph')}">
      <label>${t('pw')}</label><input id="lpw" type="password">
      <button class="btn" onclick="doLogin()">${t('login')}</button>
      <div class="switch" onclick="AUTHMODE='signup';render()">${t('to_signup')}</div></div>`;
  }
  return `<div class="card"><h3>${t('signup')}</h3>
    <label>${t('email')}</label><input id="sEmail" type="email">
    <label>${t('pw')}</label><input id="sPw" type="password">
    <label>${t('name')}</label><input id="sName">
    <label>${t('phone')}</label><input id="sPhone">
    <label>${t('addr')}</label><input id="sAddr">
    <button class="btn" onclick="doSignup()">${t('signup')}</button>
    <div class="switch" onclick="AUTHMODE='login';render()">${t('to_login')}</div></div>`;
}
async function doLogin(){
  const id=document.getElementById('lid').value.trim(), pw=document.getElementById('lpw').value;
  if(!id||!pw) return toast(t('need_id'));
  const c=await api('login',{id,pw}); ME={no:c.no,name:c.name};
  localStorage.setItem('shop_me',JSON.stringify(ME)); afterLogin();
}
async function doSignup(){
  const email=document.getElementById('sEmail').value.trim(), pw=document.getElementById('sPw').value;
  const name=document.getElementById('sName').value.trim();
  if(!email||!pw||!name) return toast(t('need_id'));
  const r=await api('signup',{email,pw,name,phone:document.getElementById('sPhone').value.trim(),addr:document.getElementById('sAddr').value.trim()});
  toast(t('signup_ok')+' '+r.no);
  ME={no:r.no,name:r.name}; localStorage.setItem('shop_me',JSON.stringify(ME)); afterLogin();
}
function logout(){ localStorage.removeItem('shop_me'); ME=null; CART={}; TAB='shop';
  document.getElementById('me').style.display='none'; document.getElementById('logoutBtn').style.display='none'; render(); }

async function afterLogin(){
  document.getElementById('me').style.display='inline-block';
  document.getElementById('me').textContent='#'+ME.no;
  document.getElementById('logoutBtn').style.display='inline-block';
  ITEMS = await api('shopItems'); TAB='shop'; render();
}

/* ── 탭 ── */
function buildNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  [['shop','tab_shop'],['orders','tab_orders']].forEach(([k,l])=>{
    const b=document.createElement('button'); b.textContent=t(l);
    if(k===TAB)b.classList.add('on'); b.onclick=()=>{TAB=k;render();}; nav.appendChild(b);
  });
}

/* ── 상점 + 장바구니 ── */
function shopView(){
  const cats=CATS.filter(c=> ITEMS.some(it=> (it.cat||'기타')===c.ko ));
  const shown=(CAT==='')?ITEMS:ITEMS.filter(it=>(it.cat||'기타')===CAT);
  const rows=shown.map(it=>{
    const q=CART[it.name]?CART[it.name].qty:0;
    const nm = LANG==='si'&&it.si ? it.si : it.name;
    return `<div class="prod"><div class="nm"><b>${nm}</b><span>${money(it.price)}</span></div>
      <div class="qty"><button onclick="chg('${encodeURIComponent(it.name)}',${it.price},-1)">−</button>
      <span id="q_${String(it.name||'').replace(/\W/g,'_')}">${q}</span>
      <button onclick="chg('${encodeURIComponent(it.name)}',${it.price},1)">＋</button></div></div>`;
  }).join('') || `<div class="empty">${t('empty_cat')}</div>`;
  const total=cartTotal();
  const mb=(on)=>`flex:1;border:1px solid var(--line);background:${on?'var(--green)':'rgba(255,255,255,.06)'};color:${on?'#fff':'var(--muted)'};padding:9px;border-radius:20px;font-size:14px;font-weight:600`;
  const chip=(a,label,val)=>`<button onclick="setCat('${val}')" style="flex:0 0 auto;border:1px solid var(--line);background:${a?'var(--green)':'rgba(255,255,255,.06)'};color:${a?'#fff':'var(--muted)'};padding:7px 13px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap">${label}</button>`;
  const chips=`<div style="display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px">`+chip(CAT==='',t('all'),'')+cats.map(c=>chip(CAT===c.ko,c.e+' '+(LANG==='si'?c.si:c.ko),c.ko)).join('')+`</div>`;
  const modeBar=`<div class="card" style="display:flex;gap:8px;align-items:center;padding:10px 12px;margin-bottom:12px">
    <span style="font-size:13px;color:var(--muted);flex:0 0 auto">${t('mode_title')}</span>
    <button style="${mb(MODE==='배달')}" onclick="setMode('배달')">${t('m_delivery')}</button>
    <button style="${mb(MODE==='픽업')}" onclick="setMode('픽업')">${t('m_pickup')}</button></div>`;
  return modeBar + chips + rows + `<div class="cartbar">
    <div class="sum"><b>${money(total)}</b><span>${t('cart')}</span></div>
    <button class="btn sm" style="flex:0 0 auto" onclick="placeOrder()">${t('order_now')}</button></div>`;
}
function chg(encName,price,d){
  const name=decodeURIComponent(encName);
  const cur=CART[name]?CART[name].qty:0; const q=Math.max(0,cur+d);
  if(q===0) delete CART[name]; else CART[name]={price,qty:q};
  render();
}
function setMode(x){ MODE=x; render(); }
function setCat(x){ CAT=x; render(); }
function cartTotal(){ let s=0; for(const k in CART)s+=CART[k].price*CART[k].qty; return s; }
async function placeOrder(){
  const lines=Object.keys(CART).map(name=>({name,price:CART[name].price,qty:CART[name].qty}));
  if(!lines.length) return toast(t('empty_cart'));
  await api('placeOrder',{no:ME.no,lines,mode:MODE});
  CART={}; toast(t('order_ok'));
  setTimeout(()=>toast(t('order_ok2')),2700);
  TAB='orders'; render();
}

/* ── 내 주문 ── */
async function ordersView(m){
  const list=await api('myOrders',{no:ME.no});
  if(!list.length){ m.innerHTML=`<div class="empty">${t('empty_order')}</div>`; return; }
  m.innerHTML=list.map(o=>{
    let b='<span class="badge b-go">'+t('st_go')+'</span>';
    if(o.status==='입금대기') b='<span class="badge b-wait">'+t('st_wait')+'</span>';
    else if(o.status==='배달완료') b='<span class="badge b-done">'+t('st_done')+'</span>';
    const items=(o.lines||[]).map(l=>l.name+' ×'+l.qty).join(', ');
    const md=o.mode==='픽업'?t('m_pickup'):(o.mode?t('m_delivery'):'');
    return `<div class="order"><div class="top"><div><b>${o.id}</b><div style="font-size:13px;color:var(--muted)">${o.date}${md?' · '+md:''} · ${items}</div></div>${b}</div>
      <div style="text-align:right;font-weight:700;margin-top:6px">${money(o.amount)}</div></div>`;
  }).join('');
}

boot();
</script>
