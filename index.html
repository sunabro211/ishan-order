<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>주문·수금 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#16a34a; --green-d:#15803d; --bg:#f4f6f5; --card:#fff;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --blue:#2563eb; --red:#dc2626; --amber:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
  body.lang-si{font-family:"Noto Sans Sinhala","Malgun Gothic",sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:12px 14px;
         display:flex;align-items:center;gap:10px}
  header .title{font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .who{font-size:12px;opacity:.9}
  .langbtn{background:rgba(255,255,255,.2);border:0;color:#fff;font-weight:700;padding:7px 11px;
           border-radius:8px;font-size:14px}
  nav{display:flex;gap:6px;overflow-x:auto;background:#fff;padding:8px 10px;border-bottom:1px solid var(--line);
      position:sticky;top:52px;z-index:15}
  nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);
             padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap}
  nav button.on{background:var(--green);color:#fff;border-color:var(--green)}
  main{padding:14px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
                        font-size:16px;background:#fff;color:var(--ink)}
  .btn{width:100%;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700;color:#fff;
       background:var(--green);margin-top:12px}
  .btn:active{transform:scale(.99)}
  .btn.blue{background:var(--blue)} .btn.grey{background:#6b7280} .btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .line{display:grid;grid-template-columns:1fr 64px 84px 34px;gap:6px;align-items:center;margin-bottom:6px}
  .line .amt{font-size:13px;color:var(--muted);text-align:right;padding-right:2px}
  .line .del{background:#fee2e2;color:var(--red);border:0;border-radius:8px;padding:9px 0;font-weight:700}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-top:8px;
         padding-top:10px;border-top:1px dashed var(--line)}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item .cust{font-weight:700;font-size:16px} .item .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .item .prods{font-size:14px;margin:8px 0;color:#374151}
  .badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .b-new{background:#fef3c7;color:var(--amber)} .b-ready{background:#dbeafe;color:var(--blue)}
  .b-done{background:#dcfce7;color:var(--green-d)} .b-due{background:#fee2e2;color:var(--red)}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .n{font-size:22px;font-weight:800;margin-top:2px} .kpi .l{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .due-red{color:var(--red);font-weight:700} .due-ok{color:var(--green-d);font-weight:700}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;
         padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
  #toast.show{opacity:.95}
  #loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:60}
  .spin{width:38px;height:38px;border:4px solid #d1fae5;border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  /* ── PC(데스크톱) 반응형: 900px 이상 ── */
  @media (min-width:900px){
    nav{position:fixed;left:0;top:52px;bottom:0;width:210px;flex-direction:column;gap:8px;
        overflow-y:auto;border-right:1px solid var(--line);border-bottom:0;align-items:stretch;padding:14px 12px}
    nav button{width:100%;text-align:left;border-radius:10px;padding:11px 14px;font-size:15px}
    main{margin:0 0 0 210px;max-width:1160px;padding:24px 30px}
    .card,.kpi,.cards{max-width:820px}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    .cards .item{margin-bottom:0}
    .cards .empty{grid-column:1/-1}
  }
</style>
</head>
<body>
<header>
  <div class="title" id="appName">주문·수금 관리</div>
  <div class="who" id="who"></div>
  <button class="langbtn" id="langBtn" onclick="toggleLang()">සිං</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>

<script>
/* ============================================================
   1) 아래 API_URL 에 Apps Script 배포 URL(.../exec) 을 붙여넣으세요.
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbyMi38MYZ021ow-j-O3ZIxMBvy8CALEoSAHnxLoGz3fZ5BmNOlbFczLW6BMpuDxHHd1/exec";

const KEY = new URLSearchParams(location.search).get('k') || '';

/* ── 언어 사전 (신할라어는 초안 — 검수 후 수정) ───────────── */
const I18N = {
  ko:{
    tab_new:'주문신청', tab_ready:'준비', tab_deliver:'배달·수금', tab_all:'전체주문',
    tab_cust:'고객', tab_item:'품목', tab_admin:'관리자',
    pick_cust:'고객 선택', add_line:'＋ 품목 추가', item:'품목', qty:'수량', price:'단가',
    total:'합계', save_order:'주문 등록', order_date:'주문일자', memo:'메모(선택)',
    st_new:'신청', st_ready:'준비완료', st_done:'배달완료',
    mark_ready:'준비완료', deliver:'배달완료 · 수금', paid:'수금액', due:'미수금',
    add_pay:'입금 추가', name:'이름', phone:'연락처', add:'추가', empty:'목록이 비어 있어요',
    cur_due:'누적 미수금', m_collect:'이번 달 총수금액', my_share:'내 몫(예상)', total_due:'총 미수금',
    m_order:'이번 달 주문', m_deliver:'이번 달 배달', fee:'수수료(%)', save:'저장',
    saved:'저장됐어요', need_cust:'고객을 선택하세요', need_item:'품목을 추가하세요',
    edit_price:'단가 수정', enter_paid:'받은 금액을 입력하세요', full:'전액'
  },
  si:{
    tab_new:'නව ඇණවුම', tab_ready:'සූදානම', tab_deliver:'බෙදා/අයකර', tab_all:'සියලු ඇණවුම්',
    tab_cust:'පාරිභෝගිකයන්', tab_item:'භාණ්ඩ', tab_admin:'පරිපාලක',
    pick_cust:'පාරිභෝගිකයා තෝරන්න', add_line:'＋ භාණ්ඩයක් එක් කරන්න', item:'භාණ්ඩය', qty:'ප්‍රමාණය', price:'ඒකක මිල',
    total:'එකතුව', save_order:'ඇණවුම සුරකින්න', order_date:'ඇණවුම් දිනය', memo:'සටහන (විකල්ප)',
    st_new:'නව', st_ready:'සූදානම්', st_done:'බෙදා හරින ලදී',
    mark_ready:'සූදානම්', deliver:'බෙදා හැරීම · අයකිරීම', paid:'ලැබුණු මුදල', due:'හිඟ මුදල',
    add_pay:'මුදල් එකතු කරන්න', name:'නම', phone:'දුරකථනය', add:'එකතු කරන්න', empty:'ලැයිස්තුව හිස්',
    cur_due:'මුළු හිඟ මුදල', m_collect:'මෙම මාසයේ එකතුව', my_share:'මගේ කොටස', total_due:'මුළු හිඟ මුදල',
    m_order:'මෙම මාසයේ ඇණවුම්', m_deliver:'මෙම මාසයේ බෙදා හැරීම්', fee:'ගාස්තුව(%)', save:'සුරකින්න',
    saved:'සුරකින ලදී', need_cust:'පාරිභෝගිකයා තෝරන්න', need_item:'භාණ්ඩයක් එක් කරන්න',
    edit_price:'මිල වෙනස් කරන්න', enter_paid:'මුදල ඇතුළත් කරන්න', full:'සම්පූර්ණ'
  }
};
let LANG = localStorage.getItem('oc_lang') || 'ko';
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.ko[k] || k; }

const TABS = {
  boss:  ['new','deliver','all','cust'],
  vice:  ['ready','deliver','all','cust','item'],
  admin: ['new','ready','deliver','all','cust','item','admin']
};

let STATE = { role:'', name:'', cur:'₩', items:[], customers:[], orders:[], tab:'' };

/* ── 통신 ───────────────────────────── */
function loading(on){ document.getElementById('loading').style.display = on?'flex':'none'; }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
async function api(action, params={}){
  if(API_URL.indexOf('http')!==0){ toast('API_URL을 먼저 설정하세요'); throw new Error('no api url'); }
  loading(true);
  try{
    const res = await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({k:KEY,action},params))});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'오류');
    return j.data;
  }catch(e){ toast(e.message||'통신 오류'); throw e; }
  finally{ loading(false); }
}
function money(n){ return STATE.cur + Number(n||0).toLocaleString(); }

/* ── 초기화 ─────────────────────────── */
async function init(){
  document.body.classList.toggle('lang-si', LANG==='si');
  document.getElementById('langBtn').textContent = LANG==='ko' ? 'සිං' : '한국어';
  const d = await api('getInit');
  STATE.role=d.role; STATE.name=d.name; STATE.cur=d.currency||'₩';
  STATE.items=d.items||[]; STATE.customers=d.customers||[];
  document.getElementById('appName').textContent = d.appName || '주문·수금 관리';
  document.getElementById('who').textContent = d.name || '';
  buildNav();
  const tabs = TABS[STATE.role]||['all'];
  go(tabs[0]);
}
function buildNav(){
  const tabs = TABS[STATE.role]||['all'];
  const nav = document.getElementById('nav'); nav.innerHTML='';
  const lbl = {new:'tab_new',ready:'tab_ready',deliver:'tab_deliver',all:'tab_all',cust:'tab_cust',item:'tab_item',admin:'tab_admin'};
  tabs.forEach(tb=>{
    const b=document.createElement('button');
    b.textContent=t(lbl[tb]); b.dataset.tab=tb; b.onclick=()=>go(tb);
    if(tb===STATE.tab)b.classList.add('on'); nav.appendChild(b);
  });
}
async function go(tab){
  STATE.tab=tab; buildNav();
  if(['ready','deliver','all'].includes(tab) || tab==='admin'){ STATE.orders = await api('listOrders'); }
  if(['cust','deliver','new','all'].includes(tab)){ STATE.customers = await api('listCustomers'); }
  render();
}
function toggleLang(){ LANG = LANG==='ko'?'si':'ko'; localStorage.setItem('oc_lang',LANG);
  document.body.classList.toggle('lang-si',LANG==='si');
  document.getElementById('langBtn').textContent = LANG==='ko'?'සිං':'한국어';
  buildNav(); render(); }

/* ── 렌더 ───────────────────────────── */
function render(){
  const m=document.getElementById('main');
  switch(STATE.tab){
    case 'new':     m.innerHTML=viewNew(); bindNew(); break;
    case 'ready':   m.innerHTML=viewList(o=>o.status==='신청'); break;
    case 'deliver': m.innerHTML=viewDeliver(); break;
    case 'all':     m.innerHTML=viewAll(); break;
    case 'cust':    m.innerHTML=viewCust(); break;
    case 'item':    m.innerHTML=viewItem(); break;
    case 'admin':   viewAdmin(m); break;
  }
}
function badge(o){
  if(o.status==='신청') return '<span class="badge b-new">'+t('st_new')+'</span>';
  if(o.status==='준비완료') return '<span class="badge b-ready">'+t('st_ready')+'</span>';
  if(o.status==='배달완료') return o.due>0
    ? '<span class="badge b-due">'+t('due')+' '+money(o.due)+'</span>'
    : '<span class="badge b-done">'+t('st_done')+'</span>';
  return '';
}
function prodText(o){ return (o.lines||[]).map(l=>l.name+' ×'+l.qty).join(', '); }

/* 주문신청 (사장/관리자) */
let CART=[];
function viewNew(){
  const opt='<option value="">'+t('pick_cust')+'</option>'+STATE.customers.map(c=>`<option>${c.name}</option>`).join('');
  return `<div class="card">
    <label>${t('order_date')}</label><input type="date" id="oDate">
    <label>${t('pick_cust')}</label><select id="oCust">${opt}</select>
    <h3 style="margin-top:14px">${t('item')}</h3>
    <div id="lines"></div>
    <button class="btn grey sm" style="margin-top:6px" onclick="addLine()">${t('add_line')}</button>
    <div class="total"><span>${t('total')}</span><span id="oTotal">${money(0)}</span></div>
    <label>${t('memo')}</label><input id="oMemo">
    <button class="btn" onclick="submitOrder()">${t('save_order')}</button>
  </div>`;
}
function bindNew(){ CART=[]; document.getElementById('oDate').value=new Date().toISOString().slice(0,10); addLine(); }
function addLine(){ CART.push({name:'',qty:1,price:0}); drawLines(); }
function drawLines(){
  const box=document.getElementById('lines'); if(!box)return;
  box.innerHTML=CART.map((l,i)=>{
    const opt='<option value="">-</option>'+STATE.items.map(it=>`<option ${it.name===l.name?'selected':''}>${it.name}</option>`).join('');
    const amt=(l.qty*l.price)||0;
    return `<div class="line">
      <select onchange="setLine(${i},'name',this.value)">${opt}</select>
      <input type="number" min="0" value="${l.qty}" onchange="setLine(${i},'qty',this.value)">
      <div class="amt">${money(amt)}</div>
      <button class="del" onclick="delLine(${i})">×</button>
    </div>`;
  }).join('');
  document.getElementById('oTotal').textContent=money(CART.reduce((s,l)=>s+(l.qty*l.price||0),0));
}
function setLine(i,f,v){
  if(f==='name'){ const it=STATE.items.find(x=>x.name===v); CART[i].name=v; CART[i].price=it?it.price:0; }
  else CART[i][f]=Number(v)||0;
  drawLines();
}
function delLine(i){ CART.splice(i,1); if(!CART.length)CART.push({name:'',qty:1,price:0}); drawLines(); }
async function submitOrder(){
  const cust=document.getElementById('oCust').value;
  const lines=CART.filter(l=>l.name && l.qty>0);
  if(!cust) return toast(t('need_cust'));
  if(!lines.length) return toast(t('need_item'));
  await api('addOrder',{customer:cust,date:document.getElementById('oDate').value,memo:document.getElementById('oMemo').value,lines});
  toast(t('saved')); go('new');
}

/* 준비 탭 (부사장) */
function viewList(filter){
  const list=STATE.orders.filter(filter);
  if(!list.length) return `<div class="empty">${t('empty')}</div>`;
  return '<div class="cards">'+list.map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date}</div></div>${badge(o)}</div>
    <div class="prods">${prodText(o)}</div>
    <div class="total" style="border:0;padding:0;margin:4px 0"><span></span><span>${money(o.amount)}</span></div>
    <button class="btn blue" onclick="markReady('${o.id}')">${t('mark_ready')}</button>
  </div>`).join('')+'</div>';
}
async function markReady(id){ await api('markReady',{id}); toast(t('saved')); go('ready'); }

/* 배달·수금 탭 (사장) */
function viewDeliver(){
  const ready=STATE.orders.filter(o=>o.status==='준비완료');
  const unpaid=STATE.orders.filter(o=>o.status==='배달완료'&&o.due>0);
  let html='';
  if(ready.length){ html+='<div class="cards">'+ready.map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date} · ${prodText(o)}</div></div>${badge(o)}</div>
    <div class="total" style="border:0;padding:0;margin:6px 0"><span>${t('total')}</span><span>${money(o.amount)}</span></div>
    <label>${t('paid')}</label>
    <div class="row"><input type="number" id="pay_${o.id}" placeholder="${t('enter_paid')}" value="${o.amount}">
      <button class="btn sm grey" style="flex:0 0 auto" onclick="document.getElementById('pay_${o.id}').value=${o.amount}">${t('full')}</button></div>
    <button class="btn" onclick="doDeliver('${o.id}')">${t('deliver')}</button>
  </div>`).join('')+'</div>'; }
  if(unpaid.length){ html+='<div class="card"><h3>'+t('due')+'</h3>'+unpaid.map(o=>`
    <div class="item" style="margin-bottom:8px">
      <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date}</div></div>
        <span class="badge b-due">${money(o.due)}</span></div>
      <div class="row" style="margin-top:8px"><input type="number" id="add_${o.id}" placeholder="${t('add_pay')}">
        <button class="btn sm blue" style="flex:0 0 auto" onclick="doAddPay('${o.id}')">${t('add_pay')}</button></div>
    </div>`).join('')+'</div>'; }
  return html || `<div class="empty">${t('empty')}</div>`;
}
async function doDeliver(id){
  const v=document.getElementById('pay_'+id).value;
  if(v==='') return toast(t('enter_paid'));
  await api('deliverCollect',{id,paid:Number(v)}); toast(t('saved')); go('deliver');
}
async function doAddPay(id){
  const v=Number(document.getElementById('add_'+id).value); if(!v) return;
  await api('addPayment',{id,amount:v}); toast(t('saved')); go('deliver');
}

/* 전체주문 */
function viewAll(){
  if(!STATE.orders.length) return `<div class="empty">${t('empty')}</div>`;
  return '<div class="cards">'+[...STATE.orders].reverse().map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date} · ${prodText(o)}</div></div>${badge(o)}</div>
    <div class="total" style="border:0;padding:0;margin:4px 0"><span class="meta">${t('paid')} ${money(o.paid)}</span><span>${money(o.amount)}</span></div>
  </div>`).join('')+'</div>';
}

/* 고객 */
function viewCust(){
  const list=STATE.customers.map(c=>`<div class="item" style="margin-bottom:8px">
    <div class="top"><div><div class="cust">${c.name}</div><div class="meta">${c.phone||''}</div></div>
      <span class="${c.due>0?'due-red':'due-ok'}">${t('cur_due')} ${money(c.due)}</span></div>
  </div>`).join('') || `<div class="empty">${t('empty')}</div>`;
  return `<div class="card"><h3>${t('add')}</h3>
    <label>${t('name')}</label><input id="cName">
    <label>${t('phone')}</label><input id="cPhone">
    <button class="btn" onclick="addCust()">${t('add')}</button></div><div class="cards">${list}</div>`;
}
async function addCust(){
  const name=document.getElementById('cName').value.trim(); if(!name) return toast(t('name'));
  await api('addCustomer',{name,phone:document.getElementById('cPhone').value.trim()}); toast(t('saved')); go('cust');
}

/* 품목 */
function viewItem(){
  const list=STATE.items.map(it=>`<div class="item" style="margin-bottom:8px">
    <div class="top"><div><div class="cust">${it.name}</div><div class="meta">${it.si||''}</div></div>
      <span style="font-weight:700">${money(it.price)}</span></div>
    <div class="row" style="margin-top:8px"><input type="number" id="pr_${it.id}" value="${it.price}">
      <button class="btn sm blue" style="flex:0 0 auto" onclick="savePrice('${it.id}')">${t('edit_price')}</button></div>
  </div>`).join('') || `<div class="empty">${t('empty')}</div>`;
  return `<div class="card"><h3>${t('add')}</h3>
    <label>${t('item')}</label><input id="iName">
    <label>${t('price')}</label><input type="number" id="iPrice">
    <label>${t('item')} (සිංහල)</label><input id="iSi">
    <button class="btn" onclick="addItem2()">${t('add')}</button></div><div class="cards">${list}</div>`;
}
async function addItem2(){
  const name=document.getElementById('iName').value.trim(); if(!name) return toast(t('item'));
  await api('addItem',{name,price:Number(document.getElementById('iPrice').value)||0,si:document.getElementById('iSi').value.trim()});
  toast(t('saved')); STATE.items=await api('listItems'); go('item');
}
async function savePrice(id){
  await api('updateItem',{id,price:Number(document.getElementById('pr_'+id).value)||0});
  toast(t('saved')); STATE.items=await api('listItems');
}

/* 관리자 */
async function viewAdmin(m){
  const s=await api('getSummary');
  m.innerHTML=`
  <div class="kpi">
    <div class="box"><div class="l">${t('m_collect')}</div><div class="n">${money(s.monthCollected)}</div></div>
    <div class="box"><div class="l">${t('total_due')}</div><div class="n due-red">${money(s.totalDue)}</div></div>
    <div class="box"><div class="l">${t('m_order')}</div><div class="n">${s.monthOrders}</div></div>
    <div class="box"><div class="l">${t('m_deliver')}</div><div class="n">${s.monthDelivered}</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3>${t('my_share')}</h3>
    <label>${t('fee')}</label>
    <div class="row"><input type="number" id="pct" value="${s.myPercent}" step="0.1">
      <button class="btn sm blue" style="flex:0 0 auto" onclick="savePct()">${t('save')}</button></div>
    <div class="total"><span>${t('my_share')} (${s.myPercent}%)</span><span>${money(s.myShare)}</span></div>
    <div class="hint">${t('m_collect')} × ${s.myPercent}% — 표시만, 자동 청구 아님</div>
  </div>`;
}
async function savePct(){
  await api('setSetting',{key:'my_percent',value:Number(document.getElementById('pct').value)||0});
  toast(t('saved')); go('admin');
}

/* 시작 */
if(!KEY){ document.getElementById('main').innerHTML='<div class="empty">접근 링크가 필요합니다. (?k=... )</div>'; }
else init().catch(()=>{});
</script>
