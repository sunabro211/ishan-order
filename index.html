<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>주문·수금 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root{
    --bg:#080b18; --bg2:#0d1226;
    --ink:#eaeeff; --muted:#8b93bd; --line:rgba(150,166,255,.16);
    --glass:rgba(255,255,255,.05); --glass-hi:rgba(255,255,255,.09);
    --green:#34d399; --green-d:#22c58a;
    --blue:#818cf8; --red:#fb7185; --amber:#fbbf24; --orange:#fb923c;
    --cyan:#22d3ee; --indigo:#818cf8; --magenta:#e879f9;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  body.lang-si{font-family:"Noto Sans Sinhala","Malgun Gothic",sans-serif}
  body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(78px);opacity:.5;
    background:
      radial-gradient(38vw 38vw at 12% 8%,#22d3ee,transparent 62%),
      radial-gradient(40vw 40vw at 88% 12%,#e879f9,transparent 62%),
      radial-gradient(48vw 48vw at 50% 110%,#818cf8,transparent 60%);}

  header{position:sticky;top:0;z-index:20;padding:12px 14px;display:flex;align-items:center;gap:11px;color:#fff;
         background:linear-gradient(160deg,rgba(129,140,248,.22),rgba(34,211,238,.05)),rgba(13,18,38,.72);
         backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  header .title{font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.2px}
  header .who{font-size:12px;color:var(--muted)}
  .hlogo{width:34px;height:34px;border-radius:11px;flex:0 0 auto;object-fit:cover;background:#fff;
         box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 18px rgba(129,140,248,.55)}
  .langbtn{background:var(--glass);border:1px solid var(--line);color:var(--ink);font-weight:700;
           padding:7px 12px;border-radius:999px;font-size:13px;font-family:var(--mono)}
  .langbtn:active{transform:scale(.96)}

  nav{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;position:sticky;top:52px;z-index:15;scrollbar-width:none;
      background:linear-gradient(180deg,rgba(8,11,24,.92),rgba(8,11,24,.55));backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line)}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);color:var(--muted);
             padding:8px 15px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;transition:.16s;font-family:inherit}
  nav button.on{color:#0a0d1f;border-color:transparent;
                background:linear-gradient(100deg,var(--cyan),var(--indigo));box-shadow:0 4px 16px rgba(129,140,248,.45)}
  nav button:active{transform:scale(.97)}

  main{padding:16px;max-width:720px;margin:0 auto}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;backdrop-filter:blur(12px)}
  .card h3{margin:0 0 11px;font-size:15px;color:var(--ink)}
  label{display:block;font-size:13px;color:var(--muted);margin:11px 0 5px}
  input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
                        font-size:16px;background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;transition:.16s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo);
    box-shadow:0 0 0 3px rgba(129,140,248,.22);background:rgba(255,255,255,.06)}
  input::placeholder,textarea::placeholder{color:#5b628a}
  select option{background:var(--bg2);color:var(--ink)}

  .btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700;color:#0a0d1f;font-family:inherit;
       background:linear-gradient(100deg,var(--green),var(--cyan));box-shadow:0 6px 20px rgba(52,211,153,.28);transition:.16s;margin-top:12px}
  .btn:active{transform:scale(.99)}
  .btn.blue{background:linear-gradient(100deg,var(--indigo),var(--magenta));color:#fff;box-shadow:0 6px 20px rgba(129,140,248,.32)}
  .btn.grey{background:var(--glass-hi);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.sm{width:auto;padding:9px 15px;font-size:14px;margin:0}

  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .line{display:grid;grid-template-columns:1fr 64px 84px 34px;gap:6px;align-items:center;margin-bottom:6px}
  .line .amt{font-size:13px;color:var(--muted);text-align:right;padding-right:2px;font-family:var(--mono)}
  .line .del{background:rgba(251,113,133,.16);color:var(--red);border:0;border-radius:9px;padding:10px 0;font-weight:700}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-top:10px;
         padding-top:11px;border-top:1px dashed var(--line);font-family:var(--mono)}

  .item{border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px;background:var(--glass);backdrop-filter:blur(8px)}
  .item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item .cust{font-weight:700;font-size:16px;color:var(--ink)}
  .item .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .item .prods{font-size:14px;margin:8px 0;color:#c3c9ee}

  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-new{background:rgba(34,211,238,.16);color:var(--cyan)}
  .b-ready{background:rgba(129,140,248,.18);color:#aab4ff}
  .b-done{background:rgba(52,211,153,.16);color:var(--green)}
  .b-due{background:rgba(251,146,60,.16);color:var(--orange)}

  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .kpi .box{background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:14px;backdrop-filter:blur(8px)}
  .kpi .n{font-size:23px;font-weight:700;margin-top:3px;font-family:var(--mono);color:#fff}
  .kpi .l{font-size:12px;color:var(--muted)}

  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
  .due-red{color:var(--orange);font-weight:700} .due-ok{color:var(--green);font-weight:700}
  .switch{color:var(--indigo);font-size:14px;font-weight:600;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;pointer-events:none;
         background:rgba(13,18,38,.92);color:#fff;border:1px solid var(--line);backdrop-filter:blur(12px);
         padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #toast.show{opacity:1}
  #loading{position:fixed;inset:0;background:rgba(8,11,24,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60}
  .spin{width:40px;height:40px;border:3px solid rgba(129,140,248,.25);border-top-color:var(--cyan);border-radius:50%;
        animation:sp 1s linear infinite;filter:drop-shadow(0 0 8px rgba(34,211,238,.5))}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (min-width:900px){
    nav{position:fixed;left:0;top:52px;bottom:0;width:220px;flex-direction:column;gap:8px;overflow-y:auto;
        border-right:1px solid var(--line);border-bottom:0;align-items:stretch;padding:16px 12px}
    nav button{width:100%;text-align:left;border-radius:12px;padding:12px 15px;font-size:15px}
    main{margin:0 0 0 220px;max-width:1160px;padding:26px 32px}
    .card,.kpi,.cards{max-width:840px}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}
    .cards .item{margin-bottom:0}
    .cards .empty{grid-column:1/-1}
  }
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>

    total:'එකතුව', save_order:'ඇණවුම සුරකින්න', order_date:'ඇණවුම් දිනය', memo:'සටහන (විකල්ප)',
    st_new:'නව', st_ready:'සූදානම්', st_done:'බෙදා හරින ලදී',
    mark_ready:'සූදානම්', deliver:'බෙදා හැරීම · අයකිරීම', paid:'ලැබුණු මුදල', due:'හිඟ මුදල',

    bank_title:'බැංකු ගිණුම (ඇණවුම් ඊමේල් හි පෙන්වයි)', bank_name:'බැංකුව', bank_account:'ගිණුම් අංකය',

  }

let LANG = localStorage.getItem('oc_lang') || 'ko';
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.ko[k] || k; }

const TABS = {
  boss:  ['new','pay','deliver','all','cust'],
  vice:  ['ready','pay','deliver','all','cust','item'],
  admin: ['new','pay','ready','deliver','all','cust','item','admin']
};

let STATE = { role:'', name:'', cur:'₩', items:[], customers:[], orders:[], tab:'' };

/* ── 통신 ───────────────────────────── */
function loading(on){ document.getElementById('loading').style.display = on?'flex':'none'; }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
async function api(action, params={}, silent){
  if(API_URL.indexOf('http')!==0){ toast('API_URL을 먼저 설정하세요'); throw new Error('no api url'); }
  if(!silent) loading(true);
  try{
    const res = await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({k:KEY,action},params))});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'오류');
    return j.data;
  }catch(e){ if(!silent) toast(e.message||'통신 오류'); throw e; }
  finally{ if(!silent) loading(false); }
}
let ADMIN_TIMER=null;
function money(n){ return STATE.cur + Number(n||0).toLocaleString(); }

/* ── 초기화 ─────────────────────────── */
async function init(){
  document.body.classList.toggle('lang-si', LANG==='si');
  document.getElementById('langBtn').textContent = LANG==='ko' ? 'සිං' : '한국어';
  const d = await api('getInit');
  STATE.role=d.role; STATE.name=d.name; STATE.cur=d.currency||'₩';
  STATE.items=d.items||[]; STATE.customers=d.customers||[];
  document.getElementById('appName').textContent = d.appName || '주문·수금 관리';
  document.getElementById('who').textContent = d.name || '';
  buildNav();
  const tabs = TABS[STATE.role]||['all'];
  go(tabs[0]);
}
function buildNav(){
  const tabs = TABS[STATE.role]||['all'];
  const nav = document.getElementById('nav'); nav.innerHTML='';
  const lbl = {new:'tab_new',ready:'tab_ready',pay:'tab_pay',deliver:'tab_deliver',all:'tab_all',cust:'tab_cust',item:'tab_item',admin:'tab_admin'};
  tabs.forEach(tb=>{
    const b=document.createElement('button');
    b.textContent=t(lbl[tb]); b.dataset.tab=tb; b.onclick=()=>go(tb);
    if(tb===STATE.tab)b.classList.add('on'); nav.appendChild(b);
  });
}
async function go(tab){
  STATE.tab=tab; buildNav();
  if(['ready','deliver','all','pay'].includes(tab) || tab==='admin'){ STATE.orders = await api('listOrders'); }
  if(['cust','deliver','new','all'].includes(tab)){ STATE.customers = await api('listCustomers'); }
  render();
}
function toggleLang(){ LANG = LANG==='ko'?'si':'ko'; localStorage.setItem('oc_lang',LANG);
  document.body.classList.toggle('lang-si',LANG==='si');
  document.getElementById('langBtn').textContent = LANG==='ko'?'සිං':'한국어';
  buildNav(); render(); }

/* ── 렌더 ───────────────────────────── */
function render(){
  const m=document.getElementById('main');
  if(ADMIN_TIMER){ clearInterval(ADMIN_TIMER); ADMIN_TIMER=null; }
  switch(STATE.tab){
    case 'new':     m.innerHTML=viewNew(); bindNew(); break;
    case 'ready':   m.innerHTML=viewList(o=>o.status==='신청'); break;
    case 'pay':     m.innerHTML=viewPay(); break;
    case 'deliver': m.innerHTML=viewDeliver(); break;
    case 'all':     m.innerHTML=viewAll(); break;
    case 'cust':    m.innerHTML=viewCust(); break;
    case 'item':    m.innerHTML=viewItem(); break;
    case 'admin':   viewAdmin(m); break;
  }
}
function badge(o){
  if(o.status==='신청') return '<span class="badge b-new">'+t('st_new')+'</span>';
  if(o.status==='준비완료') return '<span class="badge b-ready">'+t('st_ready')+'</span>';
  if(o.status==='배달완료') return o.due>0
    ? '<span class="badge b-due">'+t('due')+' '+money(o.due)+'</span>'
    : '<span class="badge b-done">'+t('st_done')+'</span>';
  return '';
}
function prodText(o){ return (o.lines||[]).map(l=>l.name+' ×'+l.qty).join(', '); }

/* 주문신청 (사장/관리자) */
let CART=[];
function viewNew(){
  const opt='<option value="">'+t('pick_cust')+'</option>'+STATE.customers.map(c=>`<option>${c.name}</option>`).join('');
  return `<div class="card">
    <label>${t('order_date')}</label><input type="date" id="oDate">
    <label>${t('pick_cust')}</label><select id="oCust">${opt}</select>
    <h3 style="margin-top:14px">${t('item')}</h3>
    <div id="lines"></div>
    <button class="btn grey sm" style="margin-top:6px" onclick="addLine()">${t('add_line')}</button>
    <div class="total"><span>${t('total')}</span><span id="oTotal">${money(0)}</span></div>
    <label>${t('memo')}</label><input id="oMemo">
    <button class="btn" onclick="submitOrder()">${t('save_order')}</button>
  </div>`;
}
function bindNew(){ CART=[]; document.getElementById('oDate').value=new Date().toISOString().slice(0,10); addLine(); }
function addLine(){ CART.push({name:'',qty:1,price:0}); drawLines(); }
function drawLines(){
  const box=document.getElementById('lines'); if(!box)return;
  box.innerHTML=CART.map((l,i)=>{
    const opt='<option value="">-</option>'+STATE.items.map(it=>`<option ${it.name===l.name?'selected':''}>${it.name}</option>`).join('');
    const amt=(l.qty*l.price)||0;
    return `<div class="line">
      <select onchange="setLine(${i},'name',this.value)">${opt}</select>
      <input type="number" min="0" value="${l.qty}" onchange="setLine(${i},'qty',this.value)">
      <div class="amt">${money(amt)}</div>
      <button class="del" onclick="delLine(${i})">×</button>
    </div>`;
  }).join('');
  document.getElementById('oTotal').textContent=money(CART.reduce((s,l)=>s+(l.qty*l.price||0),0));
}
function setLine(i,f,v){
  if(f==='name'){ const it=STATE.items.find(x=>x.name===v); CART[i].name=v; CART[i].price=it?it.price:0; }
  else CART[i][f]=Number(v)||0;
  drawLines();
}
function delLine(i){ CART.splice(i,1); if(!CART.length)CART.push({name:'',qty:1,price:0}); drawLines(); }
async function submitOrder(){
  const cust=document.getElementById('oCust').value;
  const lines=CART.filter(l=>l.name && l.qty>0);
  if(!cust) return toast(t('need_cust'));
  if(!lines.length) return toast(t('need_item'));
  await api('addOrder',{customer:cust,date:document.getElementById('oDate').value,memo:document.getElementById('oMemo').value,lines});
  toast(t('saved')); go('new');
}

/* 준비 탭 (부사장) */
function viewList(filter){
  const list=STATE.orders.filter(filter);
  if(!list.length) return `<div class="empty">${t('empty')}</div>`;
  return '<div class="cards">'+list.map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date}</div></div>${badge(o)}</div>
    <div class="prods">${prodText(o)}</div>
    <div class="total" style="border:0;padding:0;margin:4px 0"><span></span><span>${money(o.amount)}</span></div>
    <button class="btn blue" onclick="markReady('${o.id}')">${t('mark_ready')}</button>
  </div>`).join('')+'</div>';
}
async function markReady(id){ await api('markReady',{id}); toast(t('saved')); go('ready'); }

/* 입금확인 탭 (고객 온라인주문 → 이샨이 스샷 확인 후 입금확인) */
function fulfillLine(o){
  const isPickup=o.mode==='픽업';
  const m=isPickup?t('pickup'):(o.mode?t('delivery'):'');
  let h=''; if(m) h+=`<span class="badge ${isPickup?'b-ready':'b-done'}">${m}</span>`;
  if(o.phone) h+=` <span class="meta">☎ ${o.phone}</span>`;
  const addr=(!isPickup&&o.addr)?`<div class="meta">📍 ${o.addr}</div>`:'';
  return (h||addr)?`<div style="margin:6px 0">${h}${addr}</div>`:'';
}
function viewPay(){
  const list=STATE.orders.filter(o=>o.status==='입금대기');
  if(!list.length) return `<div class="empty">${t('empty')}</div>`;
  return '<div class="cards">'+list.map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer} <span class="meta">#${o.custNo||''}</span></div>
      <div class="meta">${o.date} · ${o.id} · ${prodText(o)}</div></div>
      <span class="badge b-new">${t('pay_wait')}</span></div>
    ${fulfillLine(o)}
    <div class="total" style="border:0;padding:0;margin:6px 0"><span>${t('total')}</span><span>${money(o.amount)}</span></div>
    <label>${t('deposit_amt')}</label>
    <div class="row"><input type="number" id="pay_${o.id}" value="${o.amount}">
      <button class="btn sm grey" style="flex:0 0 auto" onclick="document.getElementById('pay_${o.id}').value=${o.amount}">${t('full')}</button></div>
    <button class="btn" onclick="doMarkPaid('${o.id}')">${t('confirm_pay')}</button>
  </div>`).join('')+'</div>';
}
async function doMarkPaid(id){
  const v=document.getElementById('pay_'+id).value;
  if(v==='') return toast(t('enter_paid'));
  await api('markPaid',{id,amount:Number(v)}); toast(t('saved')); go('pay');
}

/* 배달·수금 탭 (사장) */
function viewDeliver(){
  const ready=STATE.orders.filter(o=>o.status==='준비완료');
  const unpaid=STATE.orders.filter(o=>o.status==='배달완료'&&o.due>0);
  let html='';
  if(ready.length){ html+='<div class="cards">'+ready.map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date} · ${prodText(o)}</div></div>${badge(o)}</div>
    ${fulfillLine(o)}
    <div class="total" style="border:0;padding:0;margin:6px 0"><span>${t('total')}</span><span>${money(o.amount)}</span></div>
    ${(o.fee>0||o.adjustReason)?`<div class="meta" style="margin:2px 0">${o.fee>0?t('delivery_fee')+' '+money(o.fee):''}${(o.fee>0&&o.adjustReason)?' · ':''}${o.adjustReason?t('reason')+': '+o.adjustReason:''}</div>`:''}
    ${o.paid>0?`<div class="meta" style="margin:2px 0">${t('already_paid')} ${money(o.paid)} · ${o.due<0?('<b class=\"due-ok\">'+t('refund')+' '+money(-o.due)+'</b>'):(t('remaining')+' <b class=\"due-red\">'+money(o.due)+'</b>')}</div>`:''}
    <div class="switch" style="text-align:left;margin:6px 0" onclick="toggleAdj('${o.id}')">✎ ${t('adjust')}</div>
    <div id="adjWrap_${o.id}" style="display:none;border-top:1px dashed var(--line);padding-top:8px;margin-bottom:4px">
      <label>${t('goods_amt')}</label><input type="number" id="adjAmt_${o.id}" value="${o.amount-(o.fee||0)}">
      ${o.mode!=='픽업'?`<label>${t('delivery_fee')}</label><input type="number" id="adjFee_${o.id}" value="${o.fee||0}">`:`<input type="hidden" id="adjFee_${o.id}" value="0">`}
      <label>${t('reason')}</label><input id="adjReason_${o.id}" placeholder="${t('reason_ph')}">
      <button class="btn blue sm" style="margin-top:8px" onclick="doAdjust('${o.id}')">${t('apply')}</button>
    </div>
    <label>${t('collect_now')}</label>
    <div class="row"><input type="number" id="pay_${o.id}" placeholder="${t('enter_paid')}" value="${o.due>0?o.due:0}">
      <button class="btn sm grey" style="flex:0 0 auto" onclick="document.getElementById('pay_${o.id}').value=${o.due>0?o.due:0}">${t('full')}</button></div>
    <button class="btn" onclick="doDeliver('${o.id}')">${t('deliver')}</button>
  </div>`).join('')+'</div>'; }
  if(unpaid.length){ html+='<div class="card"><h3>'+t('due')+'</h3>'+unpaid.map(o=>`
    <div class="item" style="margin-bottom:8px">
      <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date}</div></div>
        <span class="badge b-due">${money(o.due)}</span></div>
      <div class="row" style="margin-top:8px"><input type="number" id="add_${o.id}" placeholder="${t('add_pay')}">
        <button class="btn sm blue" style="flex:0 0 auto" onclick="doAddPay('${o.id}')">${t('add_pay')}</button></div>
    </div>`).join('')+'</div>'; }
  return html || `<div class="empty">${t('empty')}</div>`;
}
async function doDeliver(id){
  const v=document.getElementById('pay_'+id).value;
  if(v==='') return toast(t('enter_paid'));
  await api('deliverCollect',{id,paid:Number(v)}); toast(t('saved')); go('deliver');
}
async function doAddPay(id){
  const v=Number(document.getElementById('add_'+id).value); if(!v) return;
  await api('addPayment',{id,amount:v}); toast(t('saved')); go('deliver');
}

function toggleAdj(id){ const el=document.getElementById('adjWrap_'+id); if(el) el.style.display=(el.style.display==='none'?'block':'none'); }
async function doAdjust(id){
  const amt=Number(document.getElementById('adjAmt_'+id).value)||0;
  const fee=Number(document.getElementById('adjFee_'+id).value)||0;
  const reason=document.getElementById('adjReason_'+id).value.trim();
  await api('adjustOrder',{id,amount:amt,fee,reason}); toast(t('saved')); go('deliver');
}

/* 전체주문 */
function viewAll(){
  if(!STATE.orders.length) return `<div class="empty">${t('empty')}</div>`;
  return '<div class="cards">'+[...STATE.orders].reverse().map(o=>`<div class="item">
    <div class="top"><div><div class="cust">${o.customer}</div><div class="meta">${o.date} · ${prodText(o)}</div></div>${badge(o)}</div>
    <div class="total" style="border:0;padding:0;margin:4px 0"><span class="meta">${t('paid')} ${money(o.paid)}</span><span>${money(o.amount)}</span></div>
  </div>`).join('')+'</div>';
}

/* 고객 */
function viewCust(){
  const list=STATE.customers.map(c=>`<div class="item" style="margin-bottom:8px">
    <div class="top"><div><div class="cust">${c.name} <span class="meta">#${c.no||''}</span></div><div class="meta">${c.phone||''}${c.addr?' · '+c.addr:''}</div></div>
      <span class="${c.due>0?'due-red':'due-ok'}">${t('cur_due')} ${money(c.due)}</span></div>
  </div>`).join('') || `<div class="empty">${t('empty')}</div>`;
  return `<div class="card"><h3>${t('add')}</h3>
    <label>${t('name')}</label><input id="cName">
    <label>${t('phone')}</label><input id="cPhone">
    <label>${t('addr')}</label><input id="cAddr">
    <button class="btn" onclick="addCust()">${t('add')}</button></div><div class="cards">${list}</div>`;
}
async function addCust(){
  const name=document.getElementById('cName').value.trim(); if(!name) return toast(t('name'));
  await api('addCustomer',{name,phone:document.getElementById('cPhone').value.trim(),addr:document.getElementById('cAddr').value.trim()}); toast(t('saved')); go('cust');
}

/* 품목 */
function stockManaged(v){ return v!==''&&v!==null&&v!==undefined&&!isNaN(Number(v)); }
const CATS=[{ko:'향신료',si:'කුළුබඩු වර්ග',e:'🥣'},{ko:'병/캔류',si:'බෝතල් සහ ටින් වර්ග',e:'🍾'},{ko:'채소/과일',si:'එළවලු සහ පළතුරු',e:'🍎'},{ko:'건어물',si:'කරවල වර්ග',e:'🐟'},{ko:'비스킷류',si:'බිස්කට් වර්ග',e:'🍪'},{ko:'차/분유',si:'තේ කොල/කිරිපිටි',e:'☕'},{ko:'콩고기/면류',si:'සෝයා/ඉදිආප්ප/නූඩ්ල්ස්',e:'🍜'},{ko:'곡류/쌀',si:'සහල්/ධාන්‍ය වර්ග',e:'🌾'},{ko:'육류/생선',si:'මස් මාළු වර්ග',e:'🥩'},{ko:'초콜렛',si:'චොකලට් වර්ග',e:'🍫'},{ko:'마찬 음식',si:'මචං කෑම වර්ග',e:'🔔'},{ko:'로티/파라타/냉동식품',si:'රොටී/පරාටා සහ ශීතකල ආහාර',e:'❄️'},{ko:'기타',si:'වෙනත්',e:'📦'}];
function catOptions(sel){ return '<option value="">'+t('cat_none')+'</option>'+CATS.map(c=>`<option value="${c.ko}" ${c.ko===sel?'selected':''}>${c.e} ${c.ko}</option>`).join(''); }
function viewItem(){
  const list=STATE.items.map(it=>{
    const managed=stockManaged(it.stock);
    const low=managed && Number(it.stock)<=5;
    const stockTag=managed
      ? `<span class="${low?'due-red':'due-ok'}">${t('stock')} ${Number(it.stock)}</span>`
      : `<span class="meta">${t('stock')} ∞</span>`;
    return `<div class="item" style="margin-bottom:8px">
    <div class="top"><div><div class="cust">${it.name}</div><div class="meta">${it.si||''}${it.cat?(' · '+(CATS.find(c=>c.ko===it.cat)||{e:''}).e+' '+it.cat):''}</div></div>
      <div style="text-align:right"><div style="font-weight:700">${money(it.price)}</div>${stockTag}</div></div>
    <label style="margin:6px 0 3px">${t('category')}</label>
    <select id="ct_${it.id}">${catOptions(it.cat||'')}</select>
    <div class="row" style="margin-top:8px">
      <div style="flex:1"><label style="margin:0 0 3px">${t('price')}</label><input type="number" id="pr_${it.id}" value="${it.price}"></div>
      <div style="flex:1"><label style="margin:0 0 3px">${t('stock')}</label><input type="number" id="st_${it.id}" value="${managed?Number(it.stock):''}" placeholder="∞"></div>
    </div>
    <button class="btn sm blue" onclick="saveItem('${it.id}')">${t('save')}</button>
  </div>`;
  }).join('') || `<div class="empty">${t('empty')}</div>`;
  return `<div class="card"><h3>${t('add')}</h3>
    <label>${t('item')}</label><input id="iName">
    <label>${t('price')}</label><input type="number" id="iPrice">
    <label>${t('stock')}</label><input type="number" id="iStock" placeholder="${t('stock_ph')}">
    <label>${t('item')} (සිංහල)</label><input id="iSi">
    <label>${t('category')}</label><select id="iCat">${catOptions('')}</select>
    <button class="btn" onclick="addItem2()">${t('add')}</button></div><div class="cards">${list}</div>`;
}
async function addItem2(){
  const name=document.getElementById('iName').value.trim(); if(!name) return toast(t('item'));
  const sv=document.getElementById('iStock').value.trim();
  await api('addItem',{name,price:Number(document.getElementById('iPrice').value)||0,si:document.getElementById('iSi').value.trim(),stock:sv===''?'':Number(sv),cat:document.getElementById('iCat').value});
  toast(t('saved')); STATE.items=await api('listItems'); go('item');
}
async function saveItem(id){
  const sv=document.getElementById('st_'+id).value.trim();
  await api('updateItem',{id,price:Number(document.getElementById('pr_'+id).value)||0,stock:sv===''?'':Number(sv),cat:document.getElementById('ct_'+id).value});
  toast(t('saved')); STATE.items=await api('listItems'); go('item');
}

/* 관리자 */
async function viewAdmin(m, silent){
  const s=await api('getSummary',{},silent);
  m.innerHTML=`
  <div class="kpi">
    <div class="box"><div class="l">${t('m_collect')}</div><div class="n">${money(s.monthCollected)}</div></div>
    <div class="box"><div class="l">${t('total_due')}</div><div class="n due-red">${money(s.totalDue)}</div></div>
    <div class="box"><div class="l">${t('m_order')}</div><div class="n">${s.monthOrders}</div></div>
    <div class="box"><div class="l">${t('m_deliver')}</div><div class="n">${s.monthDelivered}</div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3>${t('my_share')}</h3>
    <label>${t('fee')}</label>
    <div class="row"><input type="number" id="pct" value="${s.myPercent}" step="0.1">
      <button class="btn sm blue" style="flex:0 0 auto" onclick="savePct()">${t('save')}</button></div>
    <div class="total"><span>${t('my_share')} (${s.myPercent}%)</span><span>${money(s.myShare)}</span></div>
    <div class="hint">${t('m_collect')} × ${s.myPercent}% — 표시만, 자동 청구 아님 · 10초마다 자동 갱신</div>
  </div>
  <div class="card">
    <h3>${t('bank_title')}</h3>
    <label>${t('bank_name')}</label><input id="bkName" value="${s.bankName||''}">
    <label>${t('bank_account')}</label><input id="bkAcc" value="${s.bankAccount||''}">
    <label>${t('bank_holder')}</label><input id="bkHold" value="${s.bankHolder||''}">
    <button class="btn" onclick="saveBank()">${t('save')}</button>
    <div class="hint">${t('bank_hint')}</div>
  </div>`;
  if(ADMIN_TIMER) clearInterval(ADMIN_TIMER);
  ADMIN_TIMER=setInterval(()=>{
    if(STATE.tab!=='admin'){ clearInterval(ADMIN_TIMER); ADMIN_TIMER=null; return; }
    if(document.activeElement && document.activeElement.tagName==='INPUT') return; // 입력 중이면 건너뜀
    viewAdmin(document.getElementById('main'), true);
  },10000);
}
async function savePct(){
  await api('setSetting',{key:'my_percent',value:Number(document.getElementById('pct').value)||0});
  toast(t('saved')); go('admin');
}
async function saveBank(){
  await api('setSetting',{key:'bank_name',value:document.getElementById('bkName').value});
  await api('setSetting',{key:'bank_account',value:document.getElementById('bkAcc').value});
  await api('setSetting',{key:'bank_holder',value:document.getElementById('bkHold').value});
  toast(t('saved')); go('admin');
}
